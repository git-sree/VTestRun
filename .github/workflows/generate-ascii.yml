name: Generate ascii art work
on: push

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: execute first code
        run: sleep 30

  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - name: execute test job
        run: sleep 30

  ascii_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute script
        run: |
          chmod +x ascii-scripts.sh
          ./ascii-scripts.sh